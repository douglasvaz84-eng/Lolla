<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lolla - Pet ID</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 430px;
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    .paw {
      font-size: 48px;
    }

    h1 {
      font-size: 40px;
      margin: 5px 0;
    }

    .lost {
      font-size: 24px;
      font-weight: 700;
      margin: 15px 0 5px;
    }

    .friendly {
      font-size: 20px;
      margin-bottom: 25px;
    }

    .info {
      background: #f7f7f7;
      border-radius: 16px;
      padding: 18px;
      margin: 20px 0;
      font-size: 17px;
      line-height: 1.7;
    }

    .button {
      display: block;
      text-decoration: none;
      padding: 17px;
      margin: 12px 0;
      border-radius: 14px;
      font-size: 19px;
      font-weight: 700;
    }

    .call {
      background: #111;
      color: white;
    }

    .text {
      background: #e9e9e9;
      color: #111;
    }

    .thanks {
      margin-top: 25px;
      font-size: 16px;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="paw">🐾</div>

    <h1>LOLLA</h1>

    <div class="lost">
      Hi! I think I'm lost.
    </div>

    <div class="friendly">
      ❤️ I'm friendly!
    </div>

    <p>
      Please help me get back home.
    </p>

    <div class="info">
      👤 <strong>Owner:</strong> Ariadne Azevedo
      <br>
      📍 <strong>Home:</strong> Brighton / Boston, MA
    </div>

    <a class="button call" href="tel:+15083819782">
      📞 Call Ariadne
    </a>

    <a class="button text" href="sms:+15083819782">
      💬 Text Ariadne
    </a>

    <div class="thanks">
      Thank you for helping me get home! 🐾
    </div>

  </div>

</body>
</html>
